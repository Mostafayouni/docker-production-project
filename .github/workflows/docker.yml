name: CI Level 5 - Test Running App

on:
  push:
    branches:
      - main
      - dev

jobs:
  ci-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t myapp ./app

      - name: Run container
        run: |
          docker run -d \
            --name myapp \
            -p 3000:3000 \
            myapp

      - name: Wait for app
        run: sleep 5

      - name: Test API (Health Check)
        run: curl -f http://localhost:3000/health

      - name: Show logs if failed
        if: failure()
        run: docker logs myapp

      - name: Stop container
        if: always()
        run: docker stop myapp && docker rm myapp